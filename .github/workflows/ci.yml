name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # go.mod требует не ниже Go 1.26.0, поэтому проверяем
        # минимальную совместимую ветку и следующую актуальную ветку.
        go-version: ['1.26.x', '1.27.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          # setup-go кэширует модули и результаты сборки Go.
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Build
        run: go build -v ./...

      - name: Run tests with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Show coverage summary
        if: success()
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go-${{ matrix.go-version }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14
