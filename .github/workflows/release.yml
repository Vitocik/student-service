# Индивидуальный вариант 3 ЛР 7: релизы по тегам v*.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.goos }} binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            extension: ''
          - goos: windows
            extension: '.exe'
          - goos: darwin
            extension: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          FILE_EXTENSION: ${{ matrix.extension }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          output="dist/student-service-${GOOS}-${GOARCH}${FILE_EXTENSION}"
          go build -trimpath -ldflags="-s -w" -o "$output" .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: student-service-${{ matrix.goos }}-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
